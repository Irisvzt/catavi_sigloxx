<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cooperativa Multiactiva Siglo XX Catavi - Mapa</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #7fb8e0; font-family: 'Segoe UI', Arial, sans-serif; }
  #canvas-container { width: 100%; height: 100%; }

  #titulo {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    text-align: center; pointer-events: none; z-index: 10;
  }
  #titulo h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
  #titulo p { margin: 4px 0 0; font-size: 14px; opacity: 0.9; }

  #tooltip {
    position: absolute; pointer-events: none; z-index: 20;
    background: rgba(20, 15, 10, 0.9); color: #f5e6c8;
    padding: 8px 14px; border-radius: 6px; font-size: 15px;
    border: 1px solid #c9a45c; display: none; transform: translate(-50%, -140%);
    white-space: nowrap;
  }

  #panel {
    position: absolute; top: 0; right: 0; width: 380px; max-width: 85%; height: 100%;
    background: linear-gradient(160deg, #2b2118, #1a140e);
    color: #f0e4cc; box-shadow: -6px 0 20px rgba(0,0,0,0.5);
    transform: translateX(100%); transition: transform 0.5s ease;
    z-index: 30; padding: 30px 26px; box-sizing: border-box; overflow-y: auto;
  }
  #panel.abierto { transform: translateX(0); }
  #panel h2 { color: #d9a441; border-bottom: 2px solid #6b4a24; padding-bottom: 10px; }
  #panel p { line-height: 1.6; font-size: 15px; }
  #cerrar-panel {
    position: absolute; top: 18px; right: 18px; background: none; border: none;
    color: #f0e4cc; font-size: 24px; cursor: pointer;
  }

  #instrucciones {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.35); padding: 8px 16px; border-radius: 20px;
    font-size: 13px; z-index: 10; pointer-events: none;
  }

  #prompt-interactuar {
    position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
    color: #1a140e; background: #f0c04a; padding: 10px 20px; border-radius: 8px;
    font-size: 15px; font-weight: bold; z-index: 15; display: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="titulo">
  <h1>Cooperativa Multiactiva Siglo XX Catavi</h1>
  <p>Recorrido virtual de las instalaciones — camina y explora</p>
</div>

<div id="tooltip"></div>

<div id="instrucciones">W A S D o flechas para caminar &nbsp;•&nbsp; Arrastra el mouse para rotar la cámara &nbsp;•&nbsp; Rueda para zoom</div>

<div id="prompt-interactuar">Presiona E para explorar</div>

<div id="panel">
  <button id="cerrar-panel">✕</button>
  <h2 id="panel-titulo"></h2>
  <p id="panel-texto"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ESCENA BASE
============================================================ */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc7ea);
scene.fog = new THREE.Fog(0x8fc7ea, 40, 110);

const aspect = window.innerWidth / window.innerHeight;
const dCam = 22;
const camera = new THREE.OrthographicCamera(-dCam*aspect, dCam*aspect, dCam, -dCam, 0.1, 300);

// posicion isometrica clasica
const isoAngle = Math.PI / 4;      // 45°
const isoElev  = Math.atan(1/Math.sqrt(2)); // ~35.26°
let camDist = 34;
let camYaw = isoAngle;
let camPitch = isoElev;

// el punto que la camara mira ahora es la posicion del jugador (se define mas abajo)
function actualizarCamara(objetivo){
  const x = objetivo.x + camDist * Math.cos(camPitch) * Math.sin(camYaw);
  const y = objetivo.y + camDist * Math.sin(camPitch);
  const z = objetivo.z + camDist * Math.cos(camPitch) * Math.cos(camYaw);
  camera.position.set(x, y, z);
  camera.lookAt(objetivo.x, objetivo.y + 2, objetivo.z);
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ============================================================
   LUCES
============================================================ */
const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(luzAmbiente);

const sol = new THREE.DirectionalLight(0xfff2d6, 0.9);
sol.position.set(30, 45, 20);
sol.castShadow = true;
sol.shadow.camera.left = -60;
sol.shadow.camera.right = 60;
sol.shadow.camera.top = 60;
sol.shadow.camera.bottom = -60;
sol.shadow.mapSize.set(2048, 2048);
scene.add(sol);

/* ============================================================
   TERRENO (color tierra/ripio como en las fotos)
============================================================ */
const terrenoGeo = new THREE.PlaneGeometry(140, 140, 40, 40);
terrenoGeo.rotateX(-Math.PI / 2);
// pequeña variacion de altura para dar textura de terreno irregular
const posAttr = terrenoGeo.attributes.position;
for (let i = 0; i < posAttr.count; i++){
  const y = (Math.random() - 0.5) * 0.15;
  posAttr.setY(i, posAttr.getY(i) + y);
}
terrenoGeo.computeVertexNormals();
const terrenoMat = new THREE.MeshStandardMaterial({ color: 0xcabb9e, roughness: 1 });
const terreno = new THREE.Mesh(terrenoGeo, terrenoMat);
terreno.receiveShadow = true;
scene.add(terreno);

// camino de tierra clara que conecta las 3 zonas (entrada -> galpon -> ingenio)
function crearCamino(){
  const puntos = [
    new THREE.Vector3(-30, 0.05, 22),
    new THREE.Vector3(-8, 0.05, 8),
    new THREE.Vector3(10, 0.05, -4),
    new THREE.Vector3(30, 0.05, -20)
  ];
  const curva = new THREE.CatmullRomCurve3(puntos);
  const geo = new THREE.TubeGeometry(curva, 40, 3.2, 8, false);
  const mat = new THREE.MeshStandardMaterial({ color: 0xe4d9bf, roughness: 1 });
  const camino = new THREE.Mesh(geo, mat);
  camino.rotation.x = 0; // el tubo ya sigue la curva, solo lo aplanamos con escala
  camino.scale.y = 0.03;
  camino.position.y = 0.02;
  camino.receiveShadow = true;
  scene.add(camino);
}
crearCamino();

/* ============================================================
   CERROS DE FONDO (como en las fotos, color tierra/verde seco)
============================================================ */
function crearCerro(x, z, escala, color){
  const geo = new THREE.ConeGeometry(14 * escala, 9 * escala, 7);
  const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 1, flatShading: true });
  const cerro = new THREE.Mesh(geo, mat);
  cerro.position.set(x, (9*escala)/2 - 1, z);
  cerro.rotation.y = Math.random() * Math.PI;
  scene.add(cerro);
}
crearCerro(-55, -40, 1.6, 0x9c8a63);
crearCerro(-20, -55, 2.0, 0x8f7d58);
crearCerro(25, -50, 1.7, 0xa08e66);
crearCerro(55, -30, 1.4, 0x93815c);
crearCerro(-60, 10, 1.3, 0x8f7d58);

/* ============================================================
   GRUPO INTERACTIVO (edificios clickeables)
============================================================ */
const objetosClickeables = [];

function agregarInteractivo(mesh, datos){
  mesh.userData = datos;
  objetosClickeables.push(mesh);
}

// techo de calamina ondulada (material reutilizable)
function techoCalamina(color){
  return new THREE.MeshStandardMaterial({ color: color, roughness: 0.85, metalness: 0.25 });
}

/* ---------- 1. LA ENTRADA (foto 1) ---------- */
function crearEntrada(){
  const grupo = new THREE.Group();

  // casa principal con techo a dos aguas (como en la foto: ladrillo + calamina)
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(9, 3.2, 6),
    new THREE.MeshStandardMaterial({ color: 0xb5673a, roughness: 0.9 }) // tono ladrillo
  );
  base.position.y = 1.6;
  base.castShadow = true; base.receiveShadow = true;
  grupo.add(base);

  const techo = new THREE.Mesh(
    new THREE.ConeGeometry(6.5, 2.2, 4),
    techoCalamina(0x8a8f94)
  );
  techo.rotation.y = Math.PI / 4;
  techo.position.y = 3.2 + 1.1;
  techo.scale.set(1, 0.55, 1.35);
  techo.castShadow = true;
  grupo.add(techo);

  // poste con antena (elemento reconocible de la foto 1)
  const poste = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.12, 10, 6),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
  );
  poste.position.set(-6, 5, -1);
  poste.castShadow = true;
  grupo.add(poste);

  // construccion de ladrillo sin terminar (a la derecha en la foto)
  const enConstruccion = new THREE.Mesh(
    new THREE.BoxGeometry(4, 2.4, 4),
    new THREE.MeshStandardMaterial({ color: 0xc98a55, roughness: 1 })
  );
  enConstruccion.position.set(7, 1.2, 2);
  enConstruccion.castShadow = true; enConstruccion.receiveShadow = true;
  grupo.add(enConstruccion);

  // letrero verde pequeño
  const letrero = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 1, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x2f6b3c })
  );
  letrero.position.set(1.5, 2, 3.1);
  grupo.add(letrero);

  // camino/arco de bienvenida simbolico
  const arcoGeo = new THREE.TorusGeometry(4.5, 0.35, 8, 20, Math.PI);
  const arco = new THREE.Mesh(arcoGeo, new THREE.MeshStandardMaterial({ color: 0x7a4a2a }));
  arco.position.set(0, 0, 9);
  arco.rotation.z = Math.PI;
  grupo.add(arco);

  grupo.position.set(-30, 0, 22);
  scene.add(grupo);

  // zona de click (caja invisible mas grande para facilitar el clic)
  const zonaClick = new THREE.Mesh(
    new THREE.BoxGeometry(20, 8, 20),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  zonaClick.position.copy(grupo.position);
  zonaClick.position.y = 4;
  scene.add(zonaClick);

  agregarInteractivo(zonaClick, {
    nombre: 'La Entrada',
    descripcion: 'El acceso principal a las instalaciones de la Cooperativa Multiactiva Siglo XX Catavi. Aquí comienza el recorrido, entre viviendas de techo de calamina, un poste con antena y las primeras construcciones del campamento minero.'
  });

  return grupo;
}
crearEntrada();

/* ---------- 2. GALPÓN DE CAMIONES / C.M. CATAVI (foto 2 y 3) ---------- */
function crearGalponCamiones(){
  const grupo = new THREE.Group();

  // galpon grande abierto con estructura metalica (foto 3)
  const columnaGeo = new THREE.CylinderGeometry(0.18, 0.18, 4.5, 6);
  const columnaMat = new THREE.MeshStandardMaterial({ color: 0x6b3f2a });
  const posicionesColumnas = [[-6,-3],[-6,3],[0,-3],[0,3],[6,-3],[6,3]];
  posicionesColumnas.forEach(([x,z])=>{
    const col = new THREE.Mesh(columnaGeo, columnaMat);
    col.position.set(x, 2.25, z);
    col.castShadow = true;
    grupo.add(col);
  });

  const techoGalpon = new THREE.Mesh(
    new THREE.BoxGeometry(14, 0.3, 8),
    techoCalamina(0x9a5a44) // calamina oxidada como en la foto
  );
  techoGalpon.position.y = 4.6;
  techoGalpon.rotation.z = 0.05;
  techoGalpon.castShadow = true;
  grupo.add(techoGalpon);

  // pared lateral de calamina (como en foto 3, a la derecha)
  const pared = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 6, 10),
    techoCalamina(0x8f8f8f)
  );
  pared.position.set(8, 3, 0);
  pared.castShadow = true; pared.receiveShadow = true;
  grupo.add(pared);

  // camion volquete (representacion simple, como el "C.M. CATAVI" de la foto)
  function crearCamionVolquete(x, z, rot, colorCarroceria){
    const camionGrupo = new THREE.Group();
    const cabina = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 1.6, 1.8),
      new THREE.MeshStandardMaterial({ color: 0xd8cfa8, roughness: 0.6 })
    );
    cabina.position.set(1.8, 1.3, 0);
    cabina.castShadow = true;
    camionGrupo.add(cabina);

    const tolva = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 1.4, 2),
      new THREE.MeshStandardMaterial({ color: colorCarroceria, roughness: 0.7 })
    );
    tolva.position.set(-1, 1.5, 0);
    tolva.castShadow = true;
    camionGrupo.add(tolva);

    const ruedaGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.4, 10);
    const ruedaMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    [[-2,-1],[-2,1],[0.2,-1],[0.2,1],[1.8,-1],[1.8,1]].forEach(([rx,rz])=>{
      const rueda = new THREE.Mesh(ruedaGeo, ruedaMat);
      rueda.rotation.x = Math.PI/2;
      rueda.position.set(rx, 0.55, rz);
      rueda.castShadow = true;
      camionGrupo.add(rueda);
    });

    camionGrupo.position.set(x, 0, z);
    camionGrupo.rotation.y = rot;
    grupo.add(camionGrupo);
  }
  crearCamionVolquete(2, -6, Math.PI/2, 0xb59a76); // tono similar al camion Volvo/beige
  crearCamionVolquete(9, 4, -0.3, 0xc9c2a8);       // tono del camion "C.M. CATAVI"

  // tambores/cilindros negros apilados (foto 2)
  const tamborGeo = new THREE.CylinderGeometry(0.6, 0.6, 1, 10);
  const tamborMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.6 });
  for (let i = 0; i < 5; i++){
    const t = new THREE.Mesh(tamborGeo, tamborMat);
    t.position.set(-9 + (i%3)*1.3, 0.5, -5 + Math.floor(i/3)*1.3);
    t.castShadow = true;
    grupo.add(t);
  }

  grupo.position.set(-8, 0, 8);
  scene.add(grupo);

  const zonaClick = new THREE.Mesh(
    new THREE.BoxGeometry(22, 8, 18),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  zonaClick.position.copy(grupo.position);
  zonaClick.position.y = 4;
  scene.add(zonaClick);

  agregarInteractivo(zonaClick, {
    nombre: 'Galpón de Camiones — C.M. Catavi',
    descripcion: 'Zona de almacenaje y maquinaria pesada. Aquí operan los camiones volquete que transportan el mineral, bajo grandes galpones de calamina que han acompañado a la cooperativa por décadas de actividad minera.'
  });

  return grupo;
}
crearGalponCamiones();

/* ---------- 3. PLANTA / INGENIO TIHUANACU (foto 4) ---------- */
function crearIngenio(){
  const grupo = new THREE.Group();

  // pared de concreto grande (foto 4)
  const muro = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 6, 8),
    new THREE.MeshStandardMaterial({ color: 0x9c9686, roughness: 1 })
  );
  muro.position.set(7, 3, 0);
  muro.castShadow = true; muro.receiveShadow = true;
  grupo.add(muro);

  // estructura abierta de la planta (columnas + techo largo, como en la foto)
  const columnaMat = new THREE.MeshStandardMaterial({ color: 0x7a4530 });
  for (let i = -2; i <= 2; i++){
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 4, 6), columnaMat);
    col.position.set(-4 + i*2.5, 2, -4);
    col.castShadow = true;
    grupo.add(col);
    const col2 = col.clone();
    col2.position.z = 4;
    grupo.add(col2);
  }
  const techoPlanta = new THREE.Mesh(
    new THREE.BoxGeometry(14, 0.25, 9),
    techoCalamina(0x9a6a52)
  );
  techoPlanta.position.y = 4.2;
  techoPlanta.rotation.z = 0.08;
  techoPlanta.castShadow = true;
  grupo.add(techoPlanta);

  // monticulos de mineral / relave (blanco-grisaceo, como en la foto)
  const monticuloMat = new THREE.MeshStandardMaterial({ color: 0xd7d2c4, roughness: 1 });
  function crearMonticulo(x, z, escala){
    const m = new THREE.Mesh(new THREE.SphereGeometry(2*escala, 8, 6), monticuloMat);
    m.scale.y = 0.4;
    m.position.set(x, 0.3*escala, z);
    m.castShadow = true; m.receiveShadow = true;
    grupo.add(m);
  }
  crearMonticulo(-2, 6, 1.4);
  crearMonticulo(1, 7.5, 1.1);
  crearMonticulo(-6, 7, 0.9);

  // pequeño charco (detalle de la foto 4)
  const charco = new THREE.Mesh(
    new THREE.CircleGeometry(1.8, 12),
    new THREE.MeshStandardMaterial({ color: 0x8a7550, roughness: 0.2, metalness: 0.3 })
  );
  charco.rotation.x = -Math.PI/2;
  charco.position.set(2, 0.05, 3);
  grupo.add(charco);

  grupo.position.set(30, 0, -20);
  grupo.rotation.y = -0.3;
  scene.add(grupo);

  const zonaClick = new THREE.Mesh(
    new THREE.BoxGeometry(22, 8, 18),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  zonaClick.position.copy(grupo.position);
  zonaClick.position.y = 4;
  scene.add(zonaClick);

  agregarInteractivo(zonaClick, {
    nombre: 'Ingenio Tihuanacu',
    descripcion: 'La planta de procesamiento de mineral, identificada por el histórico letrero en el cerro. Aquí se concentra el mineral extraído antes de su comercialización, rodeada de los característicos montículos de relave.'
  });

  return grupo;
}
crearIngenio();

/* ============================================================
   NUBES SIMPLES (para ambientar el cielo como en las fotos)
============================================================ */
function crearNube(x, y, z, escala){
  const grupo = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
  for (let i = 0; i < 4; i++){
    const esf = new THREE.Mesh(new THREE.SphereGeometry(1.5 * escala, 8, 8), mat);
    esf.position.set((Math.random()-0.5)*3*escala, (Math.random()-0.5)*0.6*escala, (Math.random()-0.5)*1.5*escala);
    grupo.add(esf);
  }
  grupo.position.set(x, y, z);
  scene.add(grupo);
}
crearNube(-30, 35, -40, 2.5);
crearNube(10, 40, -50, 3);
crearNube(35, 33, -25, 2);
crearNube(-10, 38, -60, 2.8);

/* ============================================================
   PERSONAJE JUGADOR (minero estilizado, caminable)
============================================================ */
const jugador = new THREE.Group();

const cuerpo = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.5, 1.1, 4, 8),
  new THREE.MeshStandardMaterial({ color: 0x2b3a52, roughness: 0.8 }) // overol azul oscuro
);
cuerpo.position.y = 1.1;
cuerpo.castShadow = true;
jugador.add(cuerpo);

const cabeza = new THREE.Mesh(
  new THREE.SphereGeometry(0.38, 10, 10),
  new THREE.MeshStandardMaterial({ color: 0xd8a878 })
);
cabeza.position.y = 2.0;
cabeza.castShadow = true;
jugador.add(cabeza);

// casco de minero (amarillo, reconocible)
const casco = new THREE.Mesh(
  new THREE.SphereGeometry(0.42, 10, 10, 0, Math.PI * 2, 0, Math.PI / 1.7),
  new THREE.MeshStandardMaterial({ color: 0xf0c020, roughness: 0.5 })
);
casco.position.y = 2.12;
casco.castShadow = true;
jugador.add(casco);

// linternita del casco (detalle pequeño al frente)
const linterna = new THREE.Mesh(
  new THREE.CylinderGeometry(0.08, 0.08, 0.15, 8),
  new THREE.MeshStandardMaterial({ color: 0x888888, emissive: 0xfff2b0, emissiveIntensity: 0.6 })
);
linterna.rotation.x = Math.PI / 2;
linterna.position.set(0, 2.15, 0.4);
jugador.add(linterna);

jugador.position.set(-30, 0, 35); // arranca cerca de "La Entrada"
scene.add(jugador);

// sombra de contacto simple (disco oscuro bajo los pies, ayuda a ubicar al personaje)
const sombraJugador = new THREE.Mesh(
  new THREE.CircleGeometry(0.6, 16),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
);
sombraJugador.rotation.x = -Math.PI / 2;
sombraJugador.position.y = 0.02;
jugador.add(sombraJugador);

actualizarCamara(jugador.position);

/* ============================================================
   CONTROLES: WASD PARA CAMINAR, MOUSE PARA ROTAR VISTA, E PARA INTERACTUAR
============================================================ */
const teclas = {};
window.addEventListener('keydown', (e) => { teclas[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', (e) => { teclas[e.key.toLowerCase()] = false; });

let arrastrando = false;
let ultimoX = 0, ultimoY = 0;

renderer.domElement.addEventListener('mousedown', (e) => {
  arrastrando = true; ultimoX = e.clientX; ultimoY = e.clientY;
});
window.addEventListener('mouseup', () => arrastrando = false);
window.addEventListener('mousemove', (e) => {
  if (arrastrando){
    const dx = e.clientX - ultimoX;
    const dy = e.clientY - ultimoY;
    camYaw -= dx * 0.005;
    camPitch = Math.min(1.3, Math.max(0.25, camPitch + dy * 0.005));
    ultimoX = e.clientX; ultimoY = e.clientY;
  }
});
renderer.domElement.addEventListener('wheel', (e) => {
  camDist = Math.min(70, Math.max(15, camDist + e.deltaY * 0.03));
});

// velocidad de caminata y limites del terreno
const velocidad = 0.22;
const limiteMapa = 65;

function moverJugador(){
  // direccion "adelante" de la camara, proyectada sobre el plano horizontal,
  // para que W siempre avance segun hacia donde estamos mirando (como en un juego)
  const adelante = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
  const derecha = new THREE.Vector3(Math.sin(camYaw + Math.PI/2), 0, Math.cos(camYaw + Math.PI/2));

  let mov = new THREE.Vector3();
  if (teclas['w'] || teclas['arrowup'])    mov.add(adelante);
  if (teclas['s'] || teclas['arrowdown'])  mov.sub(adelante);
  if (teclas['d'] || teclas['arrowright']) mov.add(derecha);
  if (teclas['a'] || teclas['arrowleft'])  mov.sub(derecha);

  if (mov.lengthSq() > 0){
    mov.normalize().multiplyScalar(velocidad);
    jugador.position.add(mov);
    jugador.position.x = Math.max(-limiteMapa, Math.min(limiteMapa, jugador.position.x));
    jugador.position.z = Math.max(-limiteMapa, Math.min(limiteMapa, jugador.position.z));

    // el personaje gira para mirar hacia donde camina
    const angulo = Math.atan2(mov.x, mov.z);
    jugador.rotation.y = angulo;
  }
}

/* ============================================================
   DETECCIÓN DE CERCANÍA A EDIFICIOS (en vez de raycasting por clic)
============================================================ */
const promptInteractuar = document.getElementById('prompt-interactuar');
let zonaActual = null;
const distanciaInteraccion = 8;

function revisarCercania(){
  let masCercana = null;
  let menorDistancia = Infinity;
  objetosClickeables.forEach(obj => {
    const d = jugador.position.distanceTo(obj.position);
    if (d < distanciaInteraccion && d < menorDistancia){
      menorDistancia = d;
      masCercana = obj;
    }
  });
  zonaActual = masCercana;
  promptInteractuar.style.display = zonaActual ? 'block' : 'none';
}

window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'e' && zonaActual){
    abrirPanel(zonaActual.userData);
  }
});

const panel = document.getElementById('panel');
function abrirPanel(datos){
  document.getElementById('panel-titulo').textContent = datos.nombre;
  document.getElementById('panel-texto').textContent = datos.descripcion;
  panel.classList.add('abierto');
}
document.getElementById('cerrar-panel').addEventListener('click', () => {
  panel.classList.remove('abierto');
});

/* ============================================================
   RESIZE
============================================================ */
window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  camera.left = -dCam * aspect;
  camera.right = dCam * aspect;
  camera.top = dCam;
  camera.bottom = -dCam;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   LOOP
============================================================ */
function animar(){
  requestAnimationFrame(animar);
  moverJugador();
  revisarCercania();
  actualizarCamara(jugador.position);
  renderer.render(scene, camera);
}
animar();
</script>
