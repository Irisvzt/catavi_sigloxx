<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Tunel Minero </title>
  <link rel="stylesheet" href="galeria.css">
  
</head>
<body>
    <div id="canvas-container"></div>

    <a href="../CATAVI.html?skipIntro=1" id="back-button" title="Volver a la página principal">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Volver</span>
    </a>

    <div id="help-button" title="Ayuda">
        <span class="helmet-icon">?</span>
        <span class="help-text">AYUDA</span>
    </div>

   <div id="daynight-toggle" title="Cambiar a modo día">
    <div id="daynight-track">
        <svg class="daynight-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="5" fill="#ffcc66"/>
            <g stroke="#ffcc66" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/>
                <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/>
                <line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>
            </g>
        </svg>
        <svg class="daynight-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.7 6.7 0 1 0 10.5 10.5z" fill="#ffe9b3"/>
        </svg>
        <div id="daynight-knob"></div>
    </div>
</div>

    <div class="controls">
        <div><strong>CONTROLES:</strong></div>
        <div>W / ↑ - Adelante</div>
        <div>S / ↓ - Atras</div>
        <div>A / ← - Izquierda</div>
        <div>D / → - Derecha</div>
        <div>Mouse - Rotar camara </div>
        <div>Enter - Ver foto cercana</div>
    </div>
    <div id="loading">Cargando modelos 3D...</div>
    <div id="view-button">VER</div>
    <div id="photo-overlay">
        <div id="close-button">CERRAR</div>
        <img id="overlay-image" src="" alt="Fotografía">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    
    <script type="module" src="galeria.js"></script>
</body>
</html>
