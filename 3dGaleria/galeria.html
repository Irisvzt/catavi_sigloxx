<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Tunel Minero </title>
  <link rel="stylesheet" href="galeria.css">
</head>
<body>
    <div id="canvas-container"></div>
    
    <a href="../CATAVI.html?mundo=1" id="back-button" title="Volver a la página principal">
        <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="#ffa500" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
    </a>
    
    
    <div id="help-button">
        <div class="helmet-icon">⛑️</div>
        <div class="help-text">AYUDA</div>
    </div>
    
    <div class="controls">
        <div><strong>CONTROLES:</strong></div>
        <div>W / ↑ - Adelante</div>
        <div>S / ↓ - Atras</div>
        <div>A / ← - Izquierda</div>
        <div>D / → - Derecha</div>
        <div>Q - Girar izquierda</div>
        <div>E - Girar derecha</div>
        <div>Mouse - Rotar camara</div>
    </div>
    <div id="loading">Cargando modelos 3D...</div>
    <div id="view-button">VER</div>
    <div id="photo-overlay">
        <div id="close-button">CERRAR</div>
        <img id="overlay-image" src="" alt="Fotografía">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    
    <script type="module" src="galeria.js"></script>
</body>
</html>
